name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the stable release as Latest (manual download only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Queue version changes while another release is building.
concurrency:
  group: quiet-md-release-${{ github.ref }}
  queue: max

jobs:
  preflight:
    if: github.repository == 'iuxt/quiet-md' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source and version
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import importlib.util, os, subprocess, sys
          spec = importlib.util.spec_from_file_location('release', 'scripts/publish-github-release.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          version = release.run(sys.executable, 'scripts/version.py', capture=True)
          tag = f'v{version}'
          head = release.run('git', 'rev-parse', 'HEAD', capture=True)
          release.run('git', 'merge-base', '--is-ancestor', head, 'refs/remotes/origin/main')
          tagged_commit = release.remote_tag_commit(tag)
          if tagged_commit is not None and tagged_commit != head:
              raise SystemExit(f'Existing tag {tag} points at a different commit')
          exists = subprocess.run(['gh', 'release', 'view', tag, '--repo', release.REPO], capture_output=True)
          if exists.returncode == 0:
              raise SystemExit('This release already exists; assets are never overwritten')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'commit={head}\nversion={version}\n')
          PY

  macos:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-macos
          env-vars: MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: true
      - name: Install toolchains and run checks
        run: |
          rustup component add clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          scripts/check.sh
      - name: Package both macOS architectures without notarization
        env:
          SIGNING_IDENTITY: '-'
        run: |
          MACOS_TARGET=aarch64-apple-darwin scripts/release.sh
          MACOS_TARGET=x86_64-apple-darwin scripts/release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: |
            dist-release/quiet-md-*-macos-arm64-unsigned.zip
            dist-release/quiet-md-*-macos-arm64-unsigned.zip.sha256
            dist-release/quiet-md-*-macos-x86_64-unsigned.zip
            dist-release/quiet-md-*-macos-x86_64-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Build, check and package unsigned Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools were not found' }
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & rustup component add clippy
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain installation failed' }
          & python scripts/check.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows checks failed' }
          & scripts/package-windows.ps1 -Iscc "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: |
            dist/windows/unsigned/quiet-md-*-windows-x64-setup.exe
            dist/windows/unsigned/quiet-md-*-windows-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libx11-xcb-dev libvulkan-dev libssl-dev python3 imagemagick fonts-noto-core fonts-noto-cjk
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Check and package Linux AppImage
        run: |
          rustup component add clippy
          scripts/check.sh
          scripts/package-appimage.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux
          path: |
            dist/linux/quiet-md-*-x86_64.AppImage
            dist/linux/quiet-md-*-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [preflight, macos, windows, linux]
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-macos
          env-vars: MACOSX_DEPLOYMENT_TARGET
      - name: Install release tools
        run: |
          rustup component add clippy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist/incoming
          merge-multiple: true
      - name: Publish verified stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess, sys
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          names = [f'quiet-md-{version}-macos-arm64-unsigned.zip', f'quiet-md-{version}-macos-x86_64-unsigned.zip',
                   f'quiet-md-{version}-windows-x64-setup.exe', f'quiet-md-{version}-x86_64.AppImage']
          paths = [list(Path('dist/incoming').rglob(name)) for name in names]
          if any(len(matches) != 1 for matches in paths):
              raise SystemExit('Expected exactly one package for each platform')
          command = [sys.executable, 'scripts/publish-github-release.py', '--publish', 'dist/github', '--create-tag']
          notes = Path(f'docs/releases/{version}.md')
          if notes.is_file():
              command.extend(['--notes', str(notes)])
          if os.environ['PUBLISH_RELEASE'] != 'true':
              command.append('--draft')
          subprocess.run(command + [str(matches[0]) for matches in paths], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              status = 'Published stable release' if os.environ['PUBLISH_RELEASE'] == 'true' else 'Verified release draft'
              summary.write(f'{status}: https://github.com/iuxt/quiet-md/releases/tag/v{version}\n')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-assets
          path: dist/github/*
          if-no-files-found: error
          retention-days: 14
