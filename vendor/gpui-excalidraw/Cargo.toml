[package]
name = "quiet_excalidraw"
version = "0.1.9"
edition = "2024"
license = "MIT"
repository = "https://github.com/LittleGuest/gpui-excalidraw"
publish = false

[dependencies]
gpui = "0.2.2"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
tiny-skia = "0.11.4"
unicode-segmentation = "1.13.3"
ttf-parser = "0.25.1"
perfect_freehand = "0.1.1"
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
